[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[dev]
  command = "npm run dev"
  targetPort = 5173

# "/" now serves the real static marketing landing page (dist/index.html,
# built from the repo-root index.html entry in vite.config.ts) — no
# redirect needed, Netlify serves it directly from the publish directory.

# The authenticated app shell (Milestone 4 of the SaaS-pivot plan) is a real
# vue-router SPA — direct navigation/refresh on a nested route like
# /app/companies/123 must still resolve to app.html so the router can take
# over client-side.
[[redirects]]
  from = "/app/*"
  to = "/app.html"
  status = 200
