<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* Scene 4 full-frame card — 1920x1080. Brand tokens from public/marketing-theme.css */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1920px; height: 1080px; overflow: hidden;
    background: #0a0a0d;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-family: "Space Grotesk", sans-serif;
    position: relative;
  }
  /* Radial gold glow — the brand's core motif */
  .glow {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 900px 620px at 50% 46%,
      rgba(255, 184, 48, 0.22) 0%,
      rgba(255, 184, 48, 0.10) 35%,
      rgba(255, 184, 48, 0.03) 60%,
      transparent 75%);
  }
  .wordmark {
    position: relative;
    color: #f5f4f0; font-size: 150px; font-weight: 700; letter-spacing: -0.02em;
  }
  .wordmark .fg { color: #ffb830; }
  .tagline {
    position: relative;
    margin-top: 34px;
    color: #a8a6a0; font-size: 44px; font-weight: 500; letter-spacing: 0.01em;
  }
  .tagline strong { color: #f5f4f0; font-weight: 600; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="wordmark"><span class="fg">Fore</span>ground</div>
  <div class="tagline">Every AI answer has a foreground. <strong>Make sure you're in it.</strong></div>
</body>
</html>
