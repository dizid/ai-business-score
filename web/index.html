<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIVis — AI search visibility check</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #666;
    --border: #ddd;
    --accent: #2f6fed;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --fg: #eaeaea;
      --muted: #9aa0a6;
      --border: #2a2d33;
      --accent: #6ea1ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    line-height: 1.5;
  }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 48px 20px 80px;
  }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  p.sub { color: var(--muted); margin-top: 0; margin-bottom: 32px; }
  label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    margin-top: 18px;
    margin-bottom: 6px;
  }
  label .hint { font-weight: 400; color: var(--muted); }
  input {
    width: 100%;
    padding: 10px 12px;
    font-size: 1rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--fg);
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    margin-top: 28px;
    width: 100%;
    padding: 12px 16px;
    font-size: 1rem;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: wait; }
  .status { margin-top: 16px; font-size: 0.9rem; color: var(--muted); min-height: 1.2em; }
  .error { color: #d64545; }
</style>
</head>
<body>
<main>
  <h1>AIVis — AI search visibility check</h1>
  <p class="sub">Runs 10 live checks across ChatGPT and Gemini (via Perplexity) and gives you a shareable result link. Takes ~10-20 seconds.</p>

  <form id="scan-form" method="POST" action="/scan">
    <label>Passphrase</label>
    <input type="password" name="passphrase" required autocomplete="off">

    <label>Brand name</label>
    <input type="text" name="brand" required>

    <label>Website <span class="hint">(bare domain or full URL)</span></label>
    <input type="text" name="website" required placeholder="acmeplumbing.com">

    <label>Competitors <span class="hint">(comma-separated, 2-3)</span></label>
    <input type="text" name="competitors" required placeholder="Bob's Pipes, QuickFlow Plumbing">

    <label>Category</label>
    <input type="text" name="category" required placeholder="emergency plumber">

    <label>Use case</label>
    <input type="text" name="use_case" required placeholder="a burst pipe at home">

    <label>Region</label>
    <input type="text" name="region" required placeholder="Rotterdam">

    <label>Customer segment</label>
    <input type="text" name="customer_segment" required placeholder="homeowners">

    <button type="submit" id="submit-btn">Run check</button>
    <div class="status" id="status"></div>
  </form>
</main>

<script>
  // Native form POST (not fetch): the /scan function responds with a real
  // 302 redirect to /result.html#d=<data>, and only a native browser
  // navigation reliably carries the URL fragment through a redirect chain.
  // This handler just decorates the UI — the page stays put and interactive
  // for the full 10-20s while the request is in flight, so the disabled
  // button and status text remain visible the whole time.
  const form = document.getElementById('scan-form');
  const btn = document.getElementById('submit-btn');
  const status = document.getElementById('status');

  form.addEventListener('submit', () => {
    btn.disabled = true;
    btn.textContent = 'Running checks (10-20s)...';
    status.textContent = 'Calling ChatGPT and Gemini via Perplexity — please wait, do not close this tab.';
    status.className = 'status';
  });
</script>
</body>
</html>
