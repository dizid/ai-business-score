<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIVis — AI search visibility check</title>
<meta name="robots" content="noindex, nofollow">
<style>
  /* Palette mirrors result.html — same dataviz-skill reference values, so
     the form doesn't feel like a different product than the result page. */
  :root {
    color-scheme: light;
    --bg: #f9f9f7;
    --card: #fcfcfb;
    --fg: #0b0b0b;
    --muted: #52514e;
    --faint: #898781;
    --border: rgba(11,11,11,0.10);
    --accent: #2a78d6;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --bg: #0d0d0d;
      --card: #1a1a19;
      --fg: #ffffff;
      --muted: #c3c2b7;
      --faint: #898781;
      --border: rgba(255,255,255,0.10);
      --accent: #3987e5;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0d0d0d;
    --card: #1a1a19;
    --fg: #ffffff;
    --muted: #c3c2b7;
    --faint: #898781;
    --border: rgba(255,255,255,0.10);
    --accent: #3987e5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.5;
  }
  main {
    max-width: 560px;
    margin: 0 auto;
    padding: 48px 20px 80px;
  }
  .wordmark {
    display: flex; align-items: center; gap: 8px;
    font-weight: 700; font-size: 0.95rem; letter-spacing: 0.01em;
    color: var(--muted); margin-bottom: 24px;
  }
  .wordmark svg { flex: none; }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  p.sub { color: var(--muted); margin-top: 0; margin-bottom: 32px; }
  form {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 8px 20px 20px;
  }
  label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    margin-top: 18px;
    margin-bottom: 6px;
  }
  label .hint { font-weight: 400; color: var(--muted); }
  input {
    width: 100%;
    padding: 10px 12px;
    font-size: 1rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--fg);
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    margin-top: 28px;
    width: 100%;
    padding: 12px 16px;
    font-size: 1rem;
    font-weight: 600;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: wait; }
  .status { margin-top: 16px; font-size: 0.9rem; color: var(--muted); min-height: 1.2em; }
  .error { color: #d03b3b; }
</style>
</head>
<body>
<main>
  <div class="wordmark">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
      <circle cx="10" cy="10" r="8.5" stroke="currentColor" stroke-width="2"></circle>
      <path d="M10 5.5v5l3.2 1.9" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
    </svg>
    AIVis
  </div>
  <h1>AI search visibility check</h1>
  <p class="sub">Runs 6 live checks across ChatGPT and Gemini (via Perplexity) and gives you a shareable result link. Takes ~20-30 seconds.</p>

  <form id="scan-form" method="POST" action="/scan">
    <label>Passphrase</label>
    <input type="password" name="passphrase" required autocomplete="off">

    <label>Brand name</label>
    <input type="text" name="brand" required>

    <label>Website <span class="hint">(bare domain or full URL)</span></label>
    <input type="text" name="website" required placeholder="acmeplumbing.com">

    <label>Competitors <span class="hint">(comma-separated, 2-3)</span></label>
    <input type="text" name="competitors" required placeholder="Bob's Pipes, QuickFlow Plumbing">

    <label>Category</label>
    <input type="text" name="category" required placeholder="emergency plumber">

    <label>Use case</label>
    <input type="text" name="use_case" required placeholder="a burst pipe at home">

    <label>Region</label>
    <input type="text" name="region" required placeholder="Rotterdam">

    <label>Customer segment</label>
    <input type="text" name="customer_segment" required placeholder="homeowners">

    <button type="submit" id="submit-btn">Run check</button>
    <div class="status" id="status"></div>
  </form>
</main>

<script>
  // Native form POST (not fetch): the /scan function responds with a real
  // 302 redirect to /result.html#d=<data>, and only a native browser
  // navigation reliably carries the URL fragment through a redirect chain.
  // This handler just decorates the UI — the page stays put and interactive
  // for the full ~20-30s while the request is in flight, so the disabled
  // button and status text remain visible the whole time.
  const form = document.getElementById('scan-form');
  const btn = document.getElementById('submit-btn');
  const status = document.getElementById('status');

  form.addEventListener('submit', () => {
    btn.disabled = true;
    btn.textContent = 'Running checks (~20-30s)...';
    status.textContent = 'Calling ChatGPT and Gemini via Perplexity — please wait, do not close this tab.';
    status.className = 'status';
  });
</script>
</body>
</html>
