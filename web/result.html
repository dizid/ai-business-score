<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI search visibility check</title>
<meta name="robots" content="noindex, nofollow">
<style>
  /*
    Palette source: the `dataviz` skill's validated reference palette
    (chart chrome + status colors, used verbatim — not re-derived). Status
    colors (good/warning/serious/critical) are fixed and identical in both
    modes by design; only surfaces/ink/gridlines swap for dark mode.
  */
  :root {
    color-scheme: light;
    --bg: #f9f9f7;
    --card: #fcfcfb;
    --fg: #0b0b0b;
    --muted: #52514e;
    --faint: #898781;
    --border: rgba(11,11,11,0.10);
    --gridline: #e1e0d9;
    --accent: #2a78d6;
    --debar: #d8d6cd;
    --good: #0ca30c;
    --warning: #fab219;
    --serious: #ec835a;
    --critical: #d03b3b;
    --success-text: #006300;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --bg: #0d0d0d;
      --card: #1a1a19;
      --fg: #ffffff;
      --muted: #c3c2b7;
      --faint: #898781;
      --border: rgba(255,255,255,0.10);
      --gridline: #2c2c2a;
      --accent: #3987e5;
      --debar: #3c3b37;
      --good: #0ca30c;
      --warning: #fab219;
      --serious: #ec835a;
      --critical: #d03b3b;
      --success-text: #0ca30c;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0d0d0d;
    --card: #1a1a19;
    --fg: #ffffff;
    --muted: #c3c2b7;
    --faint: #898781;
    --border: rgba(255,255,255,0.10);
    --gridline: #2c2c2a;
    --accent: #3987e5;
    --debar: #3c3b37;
    --good: #0ca30c;
    --warning: #fab219;
    --serious: #ec835a;
    --critical: #d03b3b;
    --success-text: #0ca30c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    line-height: 1.5;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }
  h1 { font-size: 1.5rem; margin: 0 0 2px; }
  a { color: var(--accent); }
  .meta { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    margin-bottom: 16px;
  }

  /* ---- score meter ---- */
  .score-card { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
  .score-ring-wrap { position: relative; width: 132px; height: 132px; flex: none; }
  .score-ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .score-ring-track { fill: none; stroke: var(--gridline); }
  .score-ring-fill { fill: none; stroke-linecap: round; transition: stroke-dashoffset 0.6s ease; }
  @media (prefers-reduced-motion: reduce) { .score-ring-fill { transition: none; } }
  .score-ring-number {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .score-ring-number .value { font-size: 2rem; font-weight: 600; font-variant-numeric: proportional-nums; line-height: 1; }
  .score-ring-number .of100 { font-size: 0.75rem; color: var(--faint); margin-top: 2px; }
  .score-side { flex: 1; min-width: 180px; }
  .score-band-label { font-size: 1.05rem; font-weight: 600; margin-bottom: 4px; }
  .score-explain { color: var(--muted); font-size: 0.88rem; }
  .band-leading .score-ring-fill { stroke: var(--good); }
  .band-leading .score-band-label { color: var(--success-text); }
  .band-visible .score-ring-fill { stroke: var(--warning); }
  .band-weak .score-ring-fill { stroke: var(--serious); }
  .band-invisible .score-ring-fill { stroke: var(--critical); }

  .headline { font-size: 1.05rem; font-weight: 500; margin-bottom: 4px; }
  .cited { color: var(--success-text); }
  .not-cited { color: var(--critical); }

  .warn {
    background: color-mix(in srgb, var(--warning) 16%, var(--card));
    border: 1px solid color-mix(in srgb, var(--warning) 45%, var(--border));
    color: var(--fg);
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 0.88rem;
    margin-bottom: 12px;
  }

  /* ---- scoreboard (emphasis bar chart: brand = accent, rivals = de-emphasis gray) ---- */
  .board-row { margin-bottom: 12px; }
  .board-row:last-child { margin-bottom: 0; }
  .board-label {
    display: flex; justify-content: space-between; gap: 8px;
    font-size: 0.88rem; margin-bottom: 4px;
  }
  .board-name { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .board-name .you-tag { color: var(--accent); font-weight: 600; }
  .board-count { color: var(--muted); flex: none; font-variant-numeric: proportional-nums; }
  .board-track { height: 20px; border-radius: 5px; background: var(--gridline); overflow: hidden; }
  .board-fill { height: 100%; border-radius: 5px; }
  .board-fill.you { background: var(--accent); }
  .board-fill.rival { background: var(--debar); }
  .board-beat { color: var(--serious); font-size: 0.8rem; margin-top: 2px; }

  /* ---- advice cards ---- */
  .advice-card {
    border-left: 4px solid var(--border);
    background: var(--card);
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 10px;
  }
  .advice-card:last-child { margin-bottom: 0; }
  .advice-tag {
    display: inline-block; font-size: 0.72rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.04em;
    margin-bottom: 4px;
  }
  .advice-card.tone-critical { border-left-color: var(--critical); }
  .advice-card.tone-critical .advice-tag { color: var(--critical); }
  .advice-card.tone-warning { border-left-color: var(--warning); }
  .advice-card.tone-warning .advice-tag { color: color-mix(in srgb, var(--warning) 70%, var(--fg)); }
  .advice-card.tone-positive { border-left-color: var(--good); }
  .advice-card.tone-positive .advice-tag { color: var(--success-text); }
  .advice-card.tone-neutral { border-left-color: var(--faint); }
  .advice-card.tone-neutral .advice-tag { color: var(--muted); }
  .advice-body { font-size: 0.92rem; }

  h2 { font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); margin: 28px 0 10px; }
  h2:first-of-type { margin-top: 0; }

  details {
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 16px;
    background: var(--card);
  }
  summary { cursor: pointer; font-weight: 600; }
  .response {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    font-size: 0.9rem;
  }
  .response:first-of-type { border-top: none; margin-top: 8px; padding-top: 8px; }
  .response .label { color: var(--muted); font-size: 0.8rem; margin-bottom: 4px; }
  footer { margin-top: 28px; color: var(--faint); font-size: 0.78rem; }
  #error { color: var(--critical); }
</style>
</head>
<body>
<main id="app">
  <p>Loading result...</p>
</main>

<script>
  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  function b64urlDecode(str) {
    const padded = str.replace(/-/g, '+').replace(/_/g, '/');
    const withPad = padded + '='.repeat((4 - (padded.length % 4)) % 4);
    return decodeURIComponent(
      atob(withPad)
        .split('')
        .map((c) => '%' + c.charCodeAt(0).toString(16).padStart(2, '0'))
        .join('')
    );
  }

  // This page has no way to verify the #d= payload actually came from a real
  // /scan call — it's a public static page reading data from a URL fragment,
  // which anyone can forge and send as a link. String fields are safe once
  // passed through esc() at render time, but numbers and enums need their
  // own contract enforced here — a forged "citedCount" or "rank" string
  // interpolated raw would be a DOM XSS. Fail closed: reject anything that
  // doesn't match the exact shape scan.mts produces, rather than coercing
  // and hoping for the best.
  const RANKS = new Set(['ranked-1', 'beaten', 'not-mentioned']);
  const ADVICE_IDS = new Set(['no-data', 'zero-citations', 'consistently-beaten', 'leading', 'mixed', 'top-rival']);
  const ADVICE_TONES = new Set(['critical', 'warning', 'positive', 'neutral']);
  const MAX_COMPETITORS = 12;
  const MAX_ADVICE_CARDS = 3;
  const MAX_NAME_LEN = 120;

  function asNonNegativeInt(v) {
    const n = Number(v);
    if (!Number.isFinite(n) || n < 0 || Math.floor(n) !== n) return null;
    return n;
  }

  function asShortString(v) {
    return typeof v === 'string' && v.length > 0 && v.length <= MAX_NAME_LEN ? v : null;
  }

  function validatePayload(raw) {
    if (!raw || typeof raw !== 'object') return null;
    if (typeof raw.brand !== 'string' || typeof raw.website !== 'string' || typeof raw.category !== 'string') return null;

    const citedCount = asNonNegativeInt(raw.citedCount);
    const completedCalls = asNonNegativeInt(raw.completedCalls);
    const failedCalls = asNonNegativeInt(raw.failedCalls);
    if (citedCount === null || completedCalls === null || failedCalls === null) return null;

    if (!Array.isArray(raw.perPromptRank)) return null;
    const perPromptRank = [];
    for (const r of raw.perPromptRank) {
      const promptIndex = asNonNegativeInt(r && r.promptIndex);
      if (promptIndex === null || !RANKS.has(r.rank)) return null;
      perPromptRank.push({ promptIndex, rank: r.rank });
    }

    // score: null (unavailable) or a 0-100 integer. Never trust a forged
    // score blindly — recomputing it from perPromptRank/completedCalls
    // would be the fully-defensive option, but the formula is deliberately
    // duplicated nowhere else client-side; bounds-check instead.
    let score = null;
    if (raw.score !== null) {
      const n = asNonNegativeInt(raw.score);
      if (n === null || n > 100) return null;
      score = n;
    }

    const competitorTallies = [];
    if (raw.competitorTallies !== undefined) {
      if (!Array.isArray(raw.competitorTallies) || raw.competitorTallies.length > MAX_COMPETITORS) return null;
      for (const c of raw.competitorTallies) {
        const name = asShortString(c && c.name);
        const mentionCount = asNonNegativeInt(c && c.mentionCount);
        const beatBrandCount = asNonNegativeInt(c && c.beatBrandCount);
        if (name === null || mentionCount === null || beatBrandCount === null) return null;
        if (mentionCount > completedCalls || beatBrandCount > mentionCount) return null;
        competitorTallies.push({ name, mentionCount, beatBrandCount });
      }
    }

    const advice = [];
    if (raw.advice !== undefined) {
      if (!Array.isArray(raw.advice) || raw.advice.length > MAX_ADVICE_CARDS) return null;
      for (const a of raw.advice) {
        if (!a || typeof a !== 'object') return null;
        if (!ADVICE_IDS.has(a.id) || !ADVICE_TONES.has(a.tone)) return null;
        const params = a.params && typeof a.params === 'object' ? a.params : {};
        advice.push({ id: a.id, tone: a.tone, params });
      }
    }

    if (!Array.isArray(raw.rawResponses)) return null;
    const rawResponses = [];
    for (const r of raw.rawResponses) {
      const promptIndex = asNonNegativeInt(r && r.promptIndex);
      if (promptIndex === null || typeof r.model !== 'string' || typeof r.text !== 'string') return null;
      rawResponses.push({ promptIndex, model: r.model, text: r.text });
    }

    const generatedAtDate = new Date(raw.generatedAt);
    if (Number.isNaN(generatedAtDate.getTime())) return null;

    // href-safety: only http(s) links get rendered as clickable — anything
    // else (javascript:, data:, etc.) is dropped rather than escaped, since
    // HTML-escaping a URL does not neutralize a javascript: scheme.
    const safeWebsiteHref = /^https?:\/\//i.test(raw.website) ? raw.website : null;

    return {
      brand: raw.brand,
      website: raw.website,
      safeWebsiteHref,
      category: raw.category,
      citedCount,
      completedCalls,
      failedCalls,
      ambiguousBrandFlag: raw.ambiguousBrandFlag === true,
      perPromptRank,
      competitorTallies,
      score,
      advice,
      rawResponses,
      generatedAtDate,
    };
  }

  // ---- score band (mirrors aivis-core.mjs's scoreBand — kept in sync by hand,
  // this file has no module import graph by design, see CLAUDE.md) ----
  function scoreBand(score) {
    if (score === null) return 'unavailable';
    if (score >= 80) return 'leading';
    if (score >= 50) return 'visible';
    if (score >= 1) return 'weak';
    return 'invisible';
  }
  const BAND_LABEL = {
    leading: 'Leading', visible: 'Visible, often beaten',
    weak: 'Weak presence', invisible: 'Invisible', unavailable: 'Score unavailable',
  };
  const BAND_EXPLAIN = {
    leading: 'Consistently the first brand AI mentions.',
    visible: 'AI knows this brand, but doesn’t always lead with it.',
    weak: 'Rarely comes up — mostly beaten or skipped.',
    invisible: 'Never came up in any completed check.',
    unavailable: 'No checks completed — try running the scan again.',
  };

  function renderScoreCard(data) {
    const band = scoreBand(data.score);
    if (data.score === null) {
      return `<div class="card score-card band-unavailable">
        <div class="score-side">
          <div class="score-band-label">${esc(BAND_LABEL[band])}</div>
          <div class="score-explain">${esc(BAND_EXPLAIN[band])}</div>
        </div>
      </div>`;
    }
    const r = 54, stroke = 12;
    const c = 2 * Math.PI * r;
    const offset = c * (1 - data.score / 100);
    return `<div class="card score-card band-${band}">
      <div class="score-ring-wrap">
        <svg viewBox="0 0 132 132">
          <circle class="score-ring-track" cx="66" cy="66" r="${r}" stroke-width="${stroke}"></circle>
          <circle class="score-ring-fill" cx="66" cy="66" r="${r}" stroke-width="${stroke}"
            stroke-dasharray="${c}" stroke-dashoffset="${offset}"></circle>
        </svg>
        <div class="score-ring-number"><span class="value">${data.score}</span><span class="of100">/ 100</span></div>
      </div>
      <div class="score-side">
        <div class="score-band-label">${esc(BAND_LABEL[band])}</div>
        <div class="score-explain">${esc(BAND_EXPLAIN[band])} AI Visibility Score — weighted for being mentioned first, not just mentioned.</div>
      </div>
    </div>`;
  }

  function renderScoreboard(data) {
    if (data.completedCalls === 0) return '';
    const rows = [{ name: data.brand, isYou: true, mentionCount: data.citedCount, beatBrandCount: 0 }]
      .concat([...data.competitorTallies].sort((a, b) => b.mentionCount - a.mentionCount));
    let html = '<h2>Scoreboard</h2><div class="card">';
    for (const row of rows) {
      const pct = Math.min(100, Math.round((row.mentionCount / data.completedCalls) * 100));
      html += `<div class="board-row">
        <div class="board-label">
          <span class="board-name" title="${esc(row.name)}">${esc(row.name)}${row.isYou ? ' <span class="you-tag">(you)</span>' : ''}</span>
          <span class="board-count">${row.mentionCount}/${data.completedCalls}</span>
        </div>
        <div class="board-track"><div class="board-fill ${row.isYou ? 'you' : 'rival'}" style="width:${pct}%"></div></div>
        ${!row.isYou && row.beatBrandCount > 0 ? `<div class="board-beat">beat you ${row.beatBrandCount}×</div>` : ''}
      </div>`;
    }
    html += '</div>';
    return html;
  }

  // Structured facts -> English. Params are individually re-validated here
  // (not trusted blindly from the payload) so a malformed-but-schema-valid
  // advice item degrades gracefully instead of rendering "undefined".
  const ADVICE_COPY = {
    'no-data': () =>
      'We couldn’t complete any checks this time — likely a temporary API issue. Try running the scan again.',
    'zero-citations': (p) =>
      `You're invisible in AI search. Across ${asNonNegativeInt(p.completedCalls) ?? '?'} checks, this brand was never mentioned — not once. Getting cited even occasionally is the highest-leverage fix here: AI models lean on third-party mentions (reviews, directories, comparison content), not a brand's own site.`,
    'consistently-beaten': (p) => {
      const rival = asShortString(p.topCompetitorName);
      const beaten = asNonNegativeInt(p.beaten) ?? 0;
      const total = asNonNegativeInt(p.completedCalls) ?? '?';
      return rival
        ? `AI knows this brand exists, but reaches for <strong>${esc(rival)}</strong> first — beaten to the mention in ${beaten} of ${total} checks. Closing this gap usually means more third-party content AI can point to as the definitive answer, not just a passing mention.`
        : `AI knows this brand exists, but a competitor is usually mentioned first — beaten in ${beaten} of ${total} checks.`;
    },
    leading: (p) =>
      `This is the AI's go-to answer. Every completed check (${asNonNegativeInt(p.completedCalls) ?? '?'}/${asNonNegativeInt(p.completedCalls) ?? '?'}) came up with this brand first — no competitor beat it to the mention. Worth re-checking periodically; this can shift as competitors publish new content.`,
    mixed: (p) => {
      const ranked1 = asNonNegativeInt(p.ranked1) ?? 0;
      const beaten = asNonNegativeInt(p.beaten) ?? 0;
      const notMentioned = asNonNegativeInt(p.notMentioned) ?? 0;
      const total = asNonNegativeInt(p.completedCalls) ?? '?';
      return `Mixed results across ${total} checks: ranked first in ${ranked1}, beaten by a competitor in ${beaten}, not mentioned at all in ${notMentioned}. The not-mentioned checks are the biggest opportunity — competitors aren't necessarily winning those either, nobody is.`;
    },
    'top-rival': (p) => {
      const name = asShortString(p.name);
      const mentionCount = asNonNegativeInt(p.mentionCount) ?? 0;
      const total = asNonNegativeInt(p.completedCalls) ?? '?';
      return name
        ? `<strong>${esc(name)}</strong> is the competitor showing up most — mentioned in ${mentionCount} of ${total} checks. Worth understanding what makes them citable (content structure, third-party coverage, reviews).`
        : '';
    },
  };
  const ADVICE_TAG = {
    critical: 'Priority', warning: 'Watch this', positive: 'Working well', neutral: 'Also worth noting',
  };

  function renderAdvice(data) {
    if (!data.advice.length) return '';
    let html = '<h2>What to do next</h2>';
    for (const card of data.advice) {
      const body = ADVICE_COPY[card.id] ? ADVICE_COPY[card.id](card.params) : '';
      if (!body) continue;
      html += `<div class="advice-card tone-${card.tone}">
        <div class="advice-tag">${esc(ADVICE_TAG[card.tone] || 'Note')}</div>
        <div class="advice-body">${body}</div>
      </div>`;
    }
    return html;
  }

  function render() {
    const app = document.getElementById('app');
    const hash = window.location.hash.replace(/^#/, '');
    const params = new URLSearchParams(hash);
    const encoded = params.get('d');

    if (!encoded) {
      app.innerHTML = '<h1>No result data</h1><p id="error">This link is missing its result data — it may be incomplete or corrupted. Ask for a fresh link.</p>';
      return;
    }

    let raw;
    try {
      raw = JSON.parse(b64urlDecode(encoded));
    } catch (err) {
      app.innerHTML = '<h1>Could not read result</h1><p id="error">This link\'s data could not be decoded. Ask for a fresh link.</p>';
      return;
    }

    const data = validatePayload(raw);
    if (!data) {
      app.innerHTML = '<h1>Invalid result data</h1><p id="error">This link\'s data doesn\'t match the expected format — it may be corrupted or not a genuine AIVis link. Ask for a fresh link.</p>';
      return;
    }

    const rank1 = data.perPromptRank.filter((r) => r.rank === 'ranked-1').length;
    const beaten = data.perPromptRank.filter((r) => r.rank === 'beaten').length;
    const notMentioned = data.perPromptRank.filter((r) => r.rank === 'not-mentioned').length;

    let headline;
    if (data.completedCalls === 0) {
      headline = `We couldn't complete any checks for <strong>${esc(data.brand)}</strong> this time — no data, not necessarily no visibility.`;
    } else if (data.citedCount === 0) {
      headline = `<span class="not-cited">${esc(data.brand)} did not show up</span> when we asked AI search about ${esc(data.category)}.`;
    } else if (beaten > 0) {
      headline = `${esc(data.brand)} showed up, but <span class="not-cited">competitors were mentioned first</span> in ${beaten} of ${data.completedCalls} checks.`;
    } else {
      headline = `<span class="cited">${esc(data.brand)} showed up</span> in ${data.citedCount} of ${data.completedCalls} checks — no competitor beat it to the mention.`;
    }

    let html = '';
    html += `<h1>${esc(data.brand)}</h1>`;
    html += '<div class="meta">';
    html += data.safeWebsiteHref
      ? `<a href="${esc(data.safeWebsiteHref)}" target="_blank" rel="noopener">${esc(data.website)}</a>`
      : esc(data.website);
    html += ` &middot; checked ${esc(data.generatedAtDate.toLocaleString())}</div>`;

    html += renderScoreCard(data);
    html += `<div class="headline">${headline}</div>`;

    if (data.ambiguousBrandFlag) {
      html += `<div class="warn">Brand name is a common word — automated detection was skipped for some checks. Read the raw responses below before trusting the count.</div>`;
    }
    if (data.failedCalls > 0) {
      html += `<div class="warn">${data.failedCalls} of ${data.completedCalls + data.failedCalls} checks failed to complete and are not counted above.</div>`;
    }

    html += renderScoreboard(data);
    html += renderAdvice(data);

    html += '<h2>Raw data</h2>';
    html += '<details><summary>Raw AI responses (for manual review)</summary>';
    for (const r of data.rawResponses) {
      html += `<div class="response"><div class="label">Prompt ${r.promptIndex + 1} &middot; ${esc(r.model)}</div>${esc(r.text)}</div>`;
    }
    html += '</details>';

    html += '<footer>Detection is presence-only, not sentiment-aware — a negative or comparative mention still counts as "cited." The score above is a heuristic weighting of that same presence-only detection, not an independently verified rank. This is a single point-in-time check, not a monitored score. Results are fixed at generation time; this link will always show the same result.</footer>';

    app.innerHTML = html;
  }

  render();
</script>
</body>
</html>
