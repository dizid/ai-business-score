<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI search visibility check</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff;
    --fg: #1a1a1a;
    --muted: #666;
    --border: #ddd;
    --accent: #2f6fed;
    --good: #1a7f37;
    --bad: #d64545;
    --warn-bg: #fff3cd;
    --warn-fg: #664d03;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115;
      --fg: #eaeaea;
      --muted: #9aa0a6;
      --border: #2a2d33;
      --accent: #6ea1ff;
      --good: #3fb950;
      --bad: #f0666e;
      --warn-bg: #3a2f00;
      --warn-fg: #ffd866;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    line-height: 1.5;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 48px 20px 80px;
  }
  h1 { font-size: 1.6rem; margin-bottom: 2px; }
  a { color: var(--accent); }
  .meta { color: var(--muted); font-size: 0.9rem; margin-bottom: 24px; }
  .headline {
    font-size: 1.15rem;
    font-weight: 600;
    padding: 16px 18px;
    border-radius: 10px;
    border: 1px solid var(--border);
    margin-bottom: 24px;
  }
  .cited { color: var(--good); }
  .not-cited { color: var(--bad); }
  .warn {
    background: var(--warn-bg);
    color: var(--warn-fg);
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 0.9rem;
    margin-bottom: 20px;
  }
  .breakdown { margin: 20px 0; }
  .breakdown div { margin-bottom: 4px; font-size: 0.95rem; }
  details {
    margin-top: 24px;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
  }
  summary { cursor: pointer; font-weight: 600; }
  .response {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    font-size: 0.9rem;
  }
  .response:first-of-type { border-top: none; margin-top: 8px; padding-top: 8px; }
  .response .label { color: var(--muted); font-size: 0.8rem; margin-bottom: 4px; }
  footer { margin-top: 32px; color: var(--muted); font-size: 0.8rem; }
  #error { color: var(--bad); }
</style>
</head>
<body>
<main id="app">
  <p>Loading result...</p>
</main>

<script>
  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
    }[c]));
  }

  function b64urlDecode(str) {
    const padded = str.replace(/-/g, '+').replace(/_/g, '/');
    const withPad = padded + '='.repeat((4 - (padded.length % 4)) % 4);
    return decodeURIComponent(
      atob(withPad)
        .split('')
        .map((c) => '%' + c.charCodeAt(0).toString(16).padStart(2, '0'))
        .join('')
    );
  }

  // This page has no way to verify the #d= payload actually came from a real
  // /scan call — it's a public static page reading data from a URL fragment,
  // which anyone can forge and send as a link. String fields are safe once
  // passed through esc() at render time, but numbers and enums need their
  // own contract enforced here — a forged "citedCount" or "rank" string
  // interpolated raw would be a DOM XSS. Fail closed: reject anything that
  // doesn't match the exact shape scan.mts produces, rather than coercing
  // and hoping for the best.
  const RANKS = new Set(['ranked-1', 'beaten', 'not-mentioned']);

  function asNonNegativeInt(v) {
    const n = Number(v);
    if (!Number.isFinite(n) || n < 0 || Math.floor(n) !== n) return null;
    return n;
  }

  function validatePayload(raw) {
    if (!raw || typeof raw !== 'object') return null;
    if (typeof raw.brand !== 'string' || typeof raw.website !== 'string' || typeof raw.category !== 'string') return null;

    const citedCount = asNonNegativeInt(raw.citedCount);
    const completedCalls = asNonNegativeInt(raw.completedCalls);
    const failedCalls = asNonNegativeInt(raw.failedCalls);
    if (citedCount === null || completedCalls === null || failedCalls === null) return null;

    if (!Array.isArray(raw.perPromptRank)) return null;
    const perPromptRank = [];
    for (const r of raw.perPromptRank) {
      const promptIndex = asNonNegativeInt(r && r.promptIndex);
      if (promptIndex === null || !RANKS.has(r.rank)) return null;
      perPromptRank.push({ promptIndex, rank: r.rank });
    }

    if (!Array.isArray(raw.rawResponses)) return null;
    const rawResponses = [];
    for (const r of raw.rawResponses) {
      const promptIndex = asNonNegativeInt(r && r.promptIndex);
      if (promptIndex === null || typeof r.model !== 'string' || typeof r.text !== 'string') return null;
      rawResponses.push({ promptIndex, model: r.model, text: r.text });
    }

    const generatedAtDate = new Date(raw.generatedAt);
    if (Number.isNaN(generatedAtDate.getTime())) return null;

    // href-safety: only http(s) links get rendered as clickable — anything
    // else (javascript:, data:, etc.) is dropped rather than escaped, since
    // HTML-escaping a URL does not neutralize a javascript: scheme.
    const safeWebsiteHref = /^https?:\/\//i.test(raw.website) ? raw.website : null;

    return {
      brand: raw.brand,
      website: raw.website,
      safeWebsiteHref,
      category: raw.category,
      citedCount,
      completedCalls,
      failedCalls,
      ambiguousBrandFlag: raw.ambiguousBrandFlag === true,
      perPromptRank,
      rawResponses,
      generatedAtDate,
    };
  }

  function render() {
    const app = document.getElementById('app');
    const hash = window.location.hash.replace(/^#/, '');
    const params = new URLSearchParams(hash);
    const encoded = params.get('d');

    if (!encoded) {
      app.innerHTML = '<h1>No result data</h1><p id="error">This link is missing its result data — it may be incomplete or corrupted. Ask for a fresh link.</p>';
      return;
    }

    let raw;
    try {
      raw = JSON.parse(b64urlDecode(encoded));
    } catch (err) {
      app.innerHTML = '<h1>Could not read result</h1><p id="error">This link\'s data could not be decoded. Ask for a fresh link.</p>';
      return;
    }

    const data = validatePayload(raw);
    if (!data) {
      app.innerHTML = '<h1>Invalid result data</h1><p id="error">This link\'s data doesn\'t match the expected format — it may be corrupted or not a genuine AIVis link. Ask for a fresh link.</p>';
      return;
    }

    const rank1 = data.perPromptRank.filter((r) => r.rank === 'ranked-1').length;
    const beaten = data.perPromptRank.filter((r) => r.rank === 'beaten').length;
    const notMentioned = data.perPromptRank.filter((r) => r.rank === 'not-mentioned').length;

    let headline;
    if (data.citedCount === 0) {
      headline = `<span class="not-cited">${esc(data.brand)} did not show up</span> when we asked AI search about ${esc(data.category)}.`;
    } else if (beaten > 0) {
      headline = `${esc(data.brand)} showed up, but <span class="not-cited">competitors were mentioned first</span> in ${beaten} of ${data.completedCalls} checks.`;
    } else {
      headline = `<span class="cited">${esc(data.brand)} showed up</span> in ${data.citedCount} of ${data.completedCalls} checks — no competitor beat it to the mention.`;
    }

    let html = '';
    html += `<h1>${esc(data.brand)}</h1>`;
    html += '<div class="meta">';
    html += data.safeWebsiteHref
      ? `<a href="${esc(data.safeWebsiteHref)}" target="_blank" rel="noopener">${esc(data.website)}</a>`
      : esc(data.website);
    html += ` &middot; checked ${esc(data.generatedAtDate.toLocaleString())}</div>`;
    html += `<div class="headline">${headline}</div>`;

    if (data.ambiguousBrandFlag) {
      html += `<div class="warn">Brand name is a common word — automated detection was skipped for some checks. Read the raw responses below before trusting the count.</div>`;
    }
    if (data.failedCalls > 0) {
      html += `<div class="warn">${data.failedCalls} of ${data.completedCalls + data.failedCalls} checks failed to complete and are not counted above.</div>`;
    }

    html += '<div class="breakdown">';
    html += `<div>Ranked #1 (no competitor mentioned first): <strong>${rank1}</strong></div>`;
    html += `<div>Mentioned, but beaten by a competitor: <strong>${beaten}</strong></div>`;
    html += `<div>Not mentioned at all: <strong>${notMentioned}</strong></div>`;
    html += '</div>';

    html += '<details><summary>Raw AI responses (for manual review)</summary>';
    for (const r of data.rawResponses) {
      html += `<div class="response"><div class="label">Prompt ${r.promptIndex + 1} &middot; ${esc(r.model)}</div>${esc(r.text)}</div>`;
    }
    html += '</details>';

    html += '<footer>Detection is presence-only, not sentiment-aware — a negative or comparative mention still counts as "cited." This is a single point-in-time check, not a monitored score. Results are fixed at generation time; this link will always show the same result.</footer>';

    app.innerHTML = html;
  }

  render();
</script>
</body>
</html>
