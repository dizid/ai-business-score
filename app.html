<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <!-- Defense in depth for the $19 single-scan flow (/app/scan?token=...):
         without this, the browser's default referrer policy still strips
         the query string cross-origin, but this makes it explicit and
         covers same-origin navigations too. No page in this app has a
         legitimate reason to leak its own URL to anything it links to. -->
    <meta name="referrer" content="no-referrer" />
    <title>Foreground — Dashboard</title>
    <!--#include:favicon-->

    <!-- Matches --stage-black in public/marketing-theme.css, same as the
         static marketing pages' theme-color tag — browser chrome (mobile
         address bar, PWA splash screen) matches the app's dark theme. -->
    <meta name="theme-color" content="#0a0a0d" />
    <!-- Display font (Space Grotesk), dashboard-only (2026-08-23 redesign) —
         same face as the marketing site (index.html) for cross-surface
         consistency, headings only. Not loaded on result.html — that page
         stays on the pre-redesign "legacy" visual treatment. -->
    <!--#include:fonts-->

    <!-- Cookie consent — see partials/consent.html. Only exposes
         window.__fgConsent/__fgLoadGA4 here; the raw-DOM banner that
         partial renders on static pages skips itself on this page (detects
         the #app mount point) since ConsentBanner.vue (src/app/components)
         renders the in-app equivalent instead — see App.vue. -->
    <!--#include:consent-->

    <!-- Google Analytics (GA4) — see index.html's identical snippet for the
         no-op-until-configured guard and rationale. Also no-ops until
         cookie consent is granted. router.ts's afterEach sends a manual
         page_view on every client-side route change, since gtag's
         automatic pageview only fires once on initial load — including the
         one it fires when consent is granted after initial load, so a late
         "Accept" still records whatever route the visitor is on then. -->
    <!--#include:ga4-->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
